# WINDOWNAV: F13-F24 with modifiers send custom CSI sequences that tmux binds
# as user-keys (see docs/windownav-host-keybinds.md and alacritty.toml). On
# Linux, XKB maps F13-F24 to XF86 keysyms, so each binding names both.
[text-bindings]
# Pane navigate
\x1b[231~ = Mod4+XF86Tools Mod4+F13
\x1b[232~ = Mod4+XF86Launch5 Mod4+F14
\x1b[202~ = Mod4+XF86Launch6 Mod4+F15
\x1b[203~ = Mod4+XF86Launch7 Mod4+F16
# Pane move
\x1b[204~ = Mod4+Shift+XF86Tools Mod4+Shift+F13
\x1b[205~ = Mod4+Shift+XF86Launch5 Mod4+Shift+F14
\x1b[206~ = Mod4+Shift+XF86Launch6 Mod4+Shift+F15
\x1b[207~ = Mod4+Shift+XF86Launch7 Mod4+Shift+F16
# Pane resize
\x1b[208~ = Mod4+Control+XF86Tools Mod4+Control+F13
\x1b[209~ = Mod4+Control+XF86Launch5 Mod4+Control+F14
\x1b[210~ = Mod4+Control+XF86Launch6 Mod4+Control+F15
\x1b[211~ = Mod4+Control+XF86Launch7 Mod4+Control+F16
# Pane consume
\x1b[212~ = Mod4+XF86Launch8 Mod4+F17
\x1b[213~ = Mod4+XF86Launch9 Mod4+F18
\x1b[214~ = Mod4+F19
\x1b[215~ = Mod4+XF86AudioMicMute Mod4+F20
# Pane emit
\x1b[216~ = Mod4+XF86TouchpadToggle Mod4+F21
\x1b[217~ = Mod4+XF86TouchpadOn Mod4+F22
\x1b[218~ = Mod4+XF86TouchpadOff Mod4+XF86Assistant Mod4+F23
\x1b[219~ = Mod4+F24
# Pane one-shot: fullscreen, float, close, create, zoom, split h, split v
\x1b[220~ = Control+Shift+Mod4+XF86Launch8 Control+Shift+Mod4+F17
\x1b[221~ = Control+Shift+Mod4+XF86Launch9 Control+Shift+Mod4+F18
\x1b[222~ = Control+Shift+Mod4+F19
\x1b[223~ = Control+Shift+Mod4+XF86AudioMicMute Control+Shift+Mod4+F20
\x1b[224~ = Control+Shift+Mod4+XF86TouchpadToggle Control+Shift+Mod4+F21
\x1b[229~ = Control+Shift+Mod4+XF86TouchpadOn Control+Shift+Mod4+F22
\x1b[230~ = Control+Shift+Mod4+XF86TouchpadOff Control+Shift+Mod4+XF86Assistant Control+Shift+Mod4+F23
# Tab navigate left/right
\x1b[225~ = Control+Mod1+XF86Tools Control+Mod1+F13
\x1b[226~ = Control+Mod1+XF86Launch7 Control+Mod1+F16
# Tab move left/right
\x1b[227~ = Control+Mod1+Shift+XF86Tools Control+Mod1+Shift+F13
\x1b[228~ = Control+Mod1+Shift+XF86Launch7 Control+Mod1+Shift+F16
