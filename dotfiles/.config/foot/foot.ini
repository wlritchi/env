# mirrors alacritty: font, padding, theme, scrollback, and WINDOWNAV keybinds

[main]
font=FiraCode Nerd Font:size=12
pad=2x2
initial-window-mode=maximized

[environment]
PROMPT_TOOLKIT_COLOR_DEPTH=DEPTH_24_BIT

[scrollback]
lines=10000
multiplier=5

[cursor]
style=block
unfocused-style=hollow

[mouse]
hide-when-typing=no

[csd]
preferred=none

# Catppuccin Macchiato, as in alacritty/catppuccin/catppuccin-macchiato.toml,
# plus the extra indexed colors 16-31 from alacritty.toml.
