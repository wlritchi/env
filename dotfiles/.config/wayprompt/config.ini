# Catppuccin Macchiato with the rosewater accent (matches fuzzel).
# See wayprompt(5). No official Catppuccin port exists for wayprompt.

[colours]
background = 0x24273A;
border = 0xF4DBD6;
text = 0xCAD3F5;
error-text = 0xED8796;

pin-background = 0x363A4F;
pin-border = 0x5B6078;
pin-square = 0xF4DBD6;

ok-button = 0xA6DA95;
ok-button-border = 0xA6DA95;
ok-button-text = 0x24273A;

not-ok-button = 0xEED49F;
not-ok-button-border = 0xEED49F;
not-ok-button-text = 0x24273A;

cancel-button = 0xED8796;
cancel-button-border = 0xED8796;
cancel-button-text = 0x24273A;
