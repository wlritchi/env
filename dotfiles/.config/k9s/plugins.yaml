plugins:
  claude-agents:
    shortCut: Shift-A
    description: Claude agents
    scopes:
      - pods
      - deployments
    command: bash
    background: false
    args:
      - -c
      - |
        if [ "$RESOURCE_NAME" = "deployments" ]; then
            target="deploy/$NAME"
        else
            target="$NAME"
        fi
        exec kubectl exec -it --context "$CONTEXT" -n "$NAMESPACE" "$target" -- \
            su claude -c "sh -c 'claude agents'"
